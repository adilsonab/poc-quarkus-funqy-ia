name: poc-quarkus-funqy-ia

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      database:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://database:5432/poc_quarkus_funqy_ia
      QUARKUS_DATASOURCE_USERNAME: poc_quarkus_funqy_ia
      QUARKUS_DATASOURCE_PASSWORD: local-dev-only
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    volumes:
      - ..:/workspace:cached
      - maven-cache:/root/.m2
    working_dir: /workspace

  database:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: poc_quarkus_funqy_ia
      POSTGRES_USER: poc_quarkus_funqy_ia
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poc_quarkus_funqy_ia -d poc_quarkus_funqy_ia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  maven-cache:
  postgres-data:
