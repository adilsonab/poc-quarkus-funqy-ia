# Database settings are supplied by the backend Dev Container compose file.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/poc_quarkus_funqy_ia}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:poc_quarkus_funqy_ia}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:local-dev-only}

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200